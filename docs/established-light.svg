<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">sphincs: established in 2022, 4+ years and 28+ tagged releases of continuous development</title>
  <desc id="desc">A wide banner with a 2022 badge, a four-year timeline from 2022 to 2026, release markers, and badges for 4+ years, 28+ releases, and continuous development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="year" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2563eb" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="188" rx="22" fill="url(#bg)" stroke="#c7d2fe"/>
  <rect x="1" y="1" width="1198" height="188" rx="22" fill="url(#dots)"/>

  <circle cx="168" cy="95" r="96" fill="url(#halo)"/>
  <circle cx="168" cy="95" r="66" fill="none" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="168" cy="95" r="55" fill="none" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="3 5"/>
  <path d="M 168 29 A 66 66 0 0 1 234 95" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <path d="M 102 95 A 66 66 0 0 0 168 161" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="168" y="90" fill="url(#year)" font-size="38" font-weight="800" letter-spacing="1">2022</text>
    <text x="168" y="112" fill="#64748b" font-size="9.5" font-weight="800" letter-spacing="3.2">ESTABLISHED</text>
  </g>

  <line x1="292" y1="34" x2="292" y2="156" stroke="#c7d2fe"/>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="330" y="41" fill="#2563eb" font-size="11" font-weight="800" letter-spacing="3">A LONG-RUNNING POST-QUANTUM PROJECT</text>
    <text x="330" y="73" fill="#0f172a" font-size="26" font-weight="800" letter-spacing="0.2">Continuously developed since 2022</text>
    <text x="330" y="95" fill="#475569" font-size="12" font-weight="600">Stateless hash-based signatures, maintained through every NIST PQC milestone.</text>
  </g>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.4">
    <rect x="330" y="106" width="96" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="378" y="123" fill="#1d4ed8" text-anchor="middle">4+ YEARS</text>
    <rect x="434" y="106" width="112" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="490" y="123" fill="#1d4ed8" text-anchor="middle">28+ RELEASES</text>
    <rect x="554" y="106" width="214" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="661" y="123" fill="#6d28d9" text-anchor="middle">CONTINUOUS DEVELOPMENT</text>
  </g>

  <line x1="330" y1="158" x2="1150" y2="158" stroke="#bfdbfe" stroke-width="10" stroke-dasharray="1.5 28" opacity="0.8"/>
  <line x1="330" y1="158" x2="1150" y2="158" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round"/>

  <g fill="#6366f1">
    <circle cx="330" cy="158" r="4.5"/>
    <circle cx="535" cy="158" r="3.5" opacity="0.75"/>
    <circle cx="740" cy="158" r="4" opacity="0.85"/>
    <circle cx="945" cy="158" r="3.5" opacity="0.75"/>
    <circle cx="1150" cy="158" r="6.5" filter="url(#glow)"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="330" y="181">2022</text>
    <text x="535" y="181">2023</text>
    <text x="740" y="181">2024</text>
    <text x="945" y="181">2025</text>
    <text x="1150" y="181">2026</text>
  </g>
  <text x="1150" y="140" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="2.4" fill="#7c3aed" text-anchor="middle">TODAY</text>
</svg>
