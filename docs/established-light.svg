<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 88" role="img" aria-labelledby="title desc">
  <title id="title">sphincs: established in 2022, 26 releases and continuous development</title>
  <desc id="desc">A wide banner with the establishment year, release count, and a 2022 to 2026 timeline.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#2563eb"/>
      <stop offset="0.8" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="86" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="30" fill="#64748b" font-size="11" font-weight="800" letter-spacing="3.4">ESTABLISHED SINCE</text>
    <text x="600" y="58" fill="#0f172a" font-size="26" font-weight="800" letter-spacing="0.4">2022</text>
    <text x="600" y="75" fill="#475569" font-size="11" font-weight="700" letter-spacing="2.2">26+ TAGGED RELEASES · CONTINUOUS DEVELOPMENT</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#64748b" font-size="11" font-weight="700">
    <text x="120" y="50" text-anchor="middle">2022</text>
    <text x="1080" y="50" text-anchor="middle">2026</text>
  </g>
  <line x1="120" y1="62" x2="1080" y2="62" stroke="url(#line)" stroke-width="2"/>
  <g fill="#2563eb">
    <circle cx="120" cy="62" r="4"/>
    <circle cx="440" cy="62" r="3" opacity="0.7"/>
    <circle cx="600" cy="62" r="3" opacity="0.7"/>
    <circle cx="760" cy="62" r="3" opacity="0.7"/>
    <circle cx="1080" cy="62" r="4"/>
  </g>
</svg>
