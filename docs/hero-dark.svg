<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">sphincs: stateless hash-based post-quantum signatures in pure Go</title>
  <desc id="desc">A split hero: the sphincs wordmark and feature chips on the left, a glowing 12-level hypertree diagram on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#071a26"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <circle cx="1010" cy="190" r="180" fill="url(#glow)"/>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="64" y="52" width="330" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <circle cx="82" cy="67" r="4" fill="#22c55e"/>
    <text x="96" y="72" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2.2">POST-QUANTUM · PURE GO</text>

    <text x="62" y="172" fill="url(#word)" font-size="96" font-weight="800" letter-spacing="-4">sphincs</text>
    <text x="66" y="214" fill="#e2e8f0" font-size="24" font-weight="600">Stateless hash-based signatures.</text>
    <text x="66" y="244" fill="#94a3b8" font-size="19">Deterministic. Fast to verify. Built on BLAKE3.</text>

    <g font-size="13" font-weight="700">
      <rect x="66" y="276" width="112" height="32" rx="16" fill="#0f172a" stroke="#4338ca"/>
      <text x="86" y="297" fill="#a5b4fc">BLAKE3-512</text>
      <rect x="190" y="276" width="108" height="32" rx="16" fill="#0f172a" stroke="#0e7490"/>
      <text x="210" y="297" fill="#67e8f9">Hypertree</text>
      <rect x="310" y="276" width="82" height="32" rx="16" fill="#0f172a" stroke="#15803d"/>
      <text x="330" y="297" fill="#86efac">WOTS+</text>
      <rect x="404" y="276" width="82" height="32" rx="16" fill="#0f172a" stroke="#a16207"/>
      <text x="424" y="297" fill="#fde047">HORST</text>
    </g>

    <text x="66" y="350" fill="#64748b" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">go get paepcke.de/sphincs</text>
    <line x1="66" y1="364" x2="486" y2="364" stroke="#1e293b" stroke-width="1"/>
  </g>

  <g stroke="url(#tree)" stroke-linecap="round" fill="none">
    <path d="M950 92 L850 150 M950 92 L950 150 M950 92 L1050 150" stroke-width="2.4" opacity="0.85"/>
    <path d="M850 150 L800 208 M850 150 L860 208 M950 150 L920 208 M950 150 L980 208 M1050 150 L1040 208 M1050 150 L1100 208" stroke-width="1.9" opacity="0.7"/>
    <path d="M800 208 L780 266 M800 208 L810 266 M860 208 L850 266 M860 208 L875 266 M920 208 L905 266 M920 208 L935 266 M980 208 L965 266 M980 208 L995 266 M1040 208 L1025 266 M1040 208 L1055 266 M1100 208 L1085 266 M1100 208 L1120 266" stroke-width="1.4" opacity="0.55"/>
    <path d="M780 266 L770 324 M780 266 L782 324 M810 266 L808 324 M810 266 L814 324 M850 266 L846 324 M850 266 L854 324 M875 266 L872 324 M875 266 L878 324 M905 266 L902 324 M905 266 L908 324 M935 266 L932 324 M935 266 L938 324 M965 266 L962 324 M965 266 L968 324 M995 266 L992 324 M995 266 L998 324 M1025 266 L1022 324 M1025 266 L1028 324 M1055 266 L1052 324 M1055 266 L1058 324 M1085 266 L1082 324 M1085 266 L1088 324 M1120 266 L1118 324" stroke-width="1" opacity="0.4"/>
  </g>

