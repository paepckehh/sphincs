    <circle cx="950" cy="92" r="10"/>
    <circle cx="850" cy="150" r="7"/><circle cx="950" cy="150" r="7"/><circle cx="1050" cy="150" r="7"/>
    <g opacity="0.82">
      <circle cx="800" cy="208" r="5"/><circle cx="860" cy="208" r="5"/><circle cx="920" cy="208" r="5"/><circle cx="980" cy="208" r="5"/><circle cx="1040" cy="208" r="5"/><circle cx="1100" cy="208" r="5"/>
    </g>
    <g opacity="0.64">
      <circle cx="780" cy="266" r="3.6"/><circle cx="810" cy="266" r="3.6"/><circle cx="850" cy="266" r="3.6"/><circle cx="875" cy="266" r="3.6"/><circle cx="905" cy="266" r="3.6"/><circle cx="935" cy="266" r="3.6"/><circle cx="965" cy="266" r="3.6"/><circle cx="995" cy="266" r="3.6"/><circle cx="1025" cy="266" r="3.6"/><circle cx="1055" cy="266" r="3.6"/><circle cx="1085" cy="266" r="3.6"/><circle cx="1120" cy="266" r="3.6"/>
    </g>
    <g opacity="0.45">
      <circle cx="770" cy="324" r="2.6"/><circle cx="782" cy="324" r="2.6"/><circle cx="808" cy="324" r="2.6"/><circle cx="814" cy="324" r="2.6"/><circle cx="846" cy="324" r="2.6"/><circle cx="854" cy="324" r="2.6"/><circle cx="872" cy="324" r="2.6"/><circle cx="878" cy="324" r="2.6"/><circle cx="902" cy="324" r="2.6"/><circle cx="908" cy="324" r="2.6"/><circle cx="932" cy="324" r="2.6"/><circle cx="938" cy="324" r="2.6"/><circle cx="962" cy="324" r="2.6"/><circle cx="968" cy="324" r="2.6"/><circle cx="992" cy="324" r="2.6"/><circle cx="998" cy="324" r="2.6"/><circle cx="1022" cy="324" r="2.6"/><circle cx="1028" cy="324" r="2.6"/><circle cx="1052" cy="324" r="2.6"/><circle cx="1058" cy="324" r="2.6"/><circle cx="1082" cy="324" r="2.6"/><circle cx="1088" cy="324" r="2.6"/><circle cx="1118" cy="324" r="2.6"/>
    </g>
  </g>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="950" y="376" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.6">60-BIT LEAF SPACE · 12 SUBTREES</text>
    <rect x="782" y="34" width="336" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
    <text x="950" y="56" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700" letter-spacing="1.4">1,056 B PUBLIC KEY · 41,000 B SIGNATURE</text>
  </g>
</svg>
